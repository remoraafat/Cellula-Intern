<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Satellite Images</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #111;
      text-align: center;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .dropzone {
      border: 2px dashed #0077cc;
      padding: 40px;
      border-radius: 10px;
      background: #f9f9f9;
      cursor: pointer;
    }

    .dropzone.dragover {
      background: #e0f2ff;
    }

    .preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin-top: 30px;
    }

    .preview-item img {
      width: 240px;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    .btn {
      background-color: #0077cc;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Upload Satellite Images (.tif)</h1>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop or Click to Upload</p>
    <input type="file" id="file-input" accept=".tif" hidden multiple>
  </div>

  <form id="predict-form" action="/predict_all" method="post">
    <input type="hidden" name="file_ids" id="file-ids">
    <button class="btn" type="submit">🔍 Predict All</button>
  </form>

  <div class="preview-grid" id="preview-grid"></div>
</div>

<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const previewGrid = document.getElementById("preview-grid");
  const fileIdsInput = document.getElementById("file-ids");
  const uploadedIds = [];

  dropzone.addEventListener("click", () => fileInput.click());

  dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });

  dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
  });

  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    const files = e.dataTransfer.files;
    handleFiles(files);
  });

  fileInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
  });

  function handleFiles(files) {
    [...files].forEach(file => {
      const formData = new FormData();
      formData.append("file", file);

      fetch("/upload_preview", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        uploadedIds.push(data.id);
        fileIdsInput.value = uploadedIds.join(",");

        const div = document.createElement("div");
        div.classList.add("preview-item");
        div.innerHTML = `
          <p><strong>${file.name}</strong></p>
          <img src="/static/results/${data.rgb_file}" alt="Preview">
        `;
        previewGrid.appendChild(div);
      })
      .catch(err => {
        console.error("Upload failed:", err);
      });
    });
  }
</script>

</body>
</html>
